ado.","p":"142","id":112},{"tema":"T7","q":"Las luces de gálibo son obligatorias en los vehículos que miden de ancho más de…","o":["1,80 metros.","2,10 metros.","2,55 metros."],"c":1,"e":"Obligatorias a más de 2,10 m; opcionales entre 1,80 y 2,10 m.","p":"144","id":113},{"tema":"T7","q":"De noche, por una carretera sin iluminación y a 90 km/h, ¿qué luz es obligatoria si no deslumbras a nadie?","o":["La de largo alcance.","La de corto alcance.","Las antiniebla traseras."],"c":0,"e":"De noche, con poca luz y a más de 40 km/h, es obligatoria la de largo alcance.","p":"144","id":114},{"tema":"T7","q":"¿Dónde está prohibido usar la luz de largo alcance?","o":["En los túneles fuera de poblado mal iluminados.","Dentro de pueblos y ciudades.","En autopistas de noche."],"c":1,"e":"Prohibida dentro de pueblos y ciudades y con el vehículo parado.","p":"145","id":115},{"tema":"T7","q":"¿Cómo puedes usar la luz de largo alcance para avisar de un peligro?","o":["Dejándola encendida fija.","Encendiéndola junto con la antiniebla trasera.","Encendiendo y apagando de forma intermitente."],"c":2,"e":"De forma intermitente, para no deslumbrar.","p":"145","id":116},{"tema":"T7","q":"Una moto circula de día por la ciudad. ¿Qué luz lleva encendida?","o":["Ninguna, porque es de día.","La de corto alcance.","La de largo alcance."],"c":1,"e":"Las motos siempre llevan encendida la de corto alcance durante el día.","p":"147","id":117},{"tema":"T7","q":"¿Cuándo se puede usar la luz antiniebla trasera?","o":["Solo cuando el tiempo y la visibilidad son muy malos.","Siempre que sea de noche.","Siempre que llueva, aunque sea poco, para que te vean mejor los de detrás."],"c":0,"e":"Solo en casos de mucha necesidad, con condiciones muy malas.","p":"148","id":118},{"tema":"T7","q":"¿Qué hace un catadióptrico?","o":["Da luz blanca hacia atrás.","Refleja la luz de otros vehículos.","Avisa a los demás de que vas a girar o a cambiar de carril."],"c":1,"e":"Refleja la luz externa de otros vehículos para qu  por sentido, la velocidad máxima general es…","o":["50 km/h.","20 km/h.","30 km/h."],"c":2,"e":"20 sin bordillos, 30 con un carril por sentido y 50 con varios.","p":"256","id":170},{"tema":"T10","q":"¿Cuál es la velocidad máxima en una autovía que pasa por dentro de una ciudad, si no hay señal?","o":["80 km/h.","50 km/h.","120 km/h."],"c":0,"e":"Autopistas y autovías en poblado: 80 km/h.","p":"257","id":171},{"tema":"T10","q":"En una carretera donde un turismo puede ir a 90 km/h como máximo, su velocidad mínima es…","o":["60 km/h.","45 km/h.","30 km/h."],"c":1,"e":"El libro pone ese ejemplo: máximo 90, mínimo 45.","p":"258","id":172},{"tema":"T10","q":"¿Cuándo puedes circular por debajo de la velocidad mínima?","o":["Cuando no hay más vehículos en la carretera.","Cuando quieres ahorrar combustible.","Con mucho tráfico, una avería o la carretera en mal estado."],"c":2,"e":"Es uno de los casos permitidos; aunque no haya nadie, está prohibido.","p":"258","id":173},{"tema":"T10","q":"A 130 km/h, el campo de visión a los lados se reduce a unos…","o":["30 grados.","70 grados.","180 grados."],"c":0,"e":"180° parado, 70° a 65 km/h y 30° a 130 km/h.","p":"260","id":174},{"tema":"T10","q":"¿Cuánto suele durar el tiempo de reacción normal ante un imprevisto, según el Tema 10?","o":["3 segundos.","0,75 segundos.","0,1 segundos."],"c":1,"e":"Suele ser de 0,75 segundos, casi un segundo.","p":"261","id":175},{"tema":"T10","q":"La distancia de detención es…","o":["la distancia de frenado menos la de reacción.","solo la distancia de frenado.","la distancia de reacción más la de frenado."],"c":2,"e":"Es la suma de la distancia de reacción y la de frenado.","p":"263","id":176},{"tema":"T10","q":"¿Qué hace que un vehículo necesite más distancia para frenar?","o":["Llevar mucha carga.","Llevar las luces encendidas.","Circular por una carretera seca y en buen estado."],"c":0,"e":"Un vehículo con mucha carga tarda más en parar.","p":"262","id":177},{"tema":"T10","q":"Un camión de más de ho de la calzada, para dejar pasar a los demás.","en el arcén izquierdo."],"c":0,"e":"Junto a la línea de separación (sin línea, cerca del carril contrario sin pisarlo).","p":"286","id":190},{"tema":"T11","q":"¿Cómo debe hacerse un cambio de sentido?","o":["Con varias maniobras cortas hacia delante y hacia atrás.","En un solo giro y sin usar la marcha atrás.","Desde el arcén izquierdo."],"c":1,"e":"Con un solo giro y sin marcha atrás, salvo si no hay otra opción.","p":"288","id":191},{"tema":"T11","q":"¿Dónde está prohibido cambiar de sentido?","o":["En una rotonda.","En una raqueta preparada para ello.","En un túnel."],"c":2,"e":"Prohibido en túneles; las rotondas y raquetas sirven para cambiar de sentido.","p":"287, 289","id":192},{"tema":"T11","q":"Cuando está permitido circular marcha atrás, ¿cuál es la distancia máxima?","o":["15 metros.","50 metros.","La necesaria para llegar a un cruce."],"c":0,"e":"No más de 15 metros, y sin entrar en un cruce.","p":"290","id":193},{"tema":"T11","q":"Tu coche se avería en la autovía y no puede seguir. ¿Qué es obligatorio colocar?","o":["Los dos triángulos de peligro, a 50 metros.","La luz naranja de preseñalización encima del coche.","Una prenda de color rojo colgada en la ventanilla del conductor."],"c":1,"e":"La luz de preseñalización es obligatoria; los triángulos, opcionales.","p":"293","id":194},{"tema":"T11","q":"Si dejas el vehículo detenido menos de dos minutos y no te alejas, estás…","o":["estacionando.","aparcando en doble fila.","parando."],"c":2,"e":"Parar: menos de dos minutos y sin alejarte.","p":"294","id":195},{"tema":"T11","q":"Aparcas un turismo en una cuesta hacia arriba. ¿Qué marcha dejas?","o":["La primera.","La marcha atrás.","Punto muerto, con el freno de mano."],"c":0,"e":"Cuesta arriba, primera; cuesta abajo, marcha atrás.","p":"295","id":196},{"tema":"T11","q":"¿Dónde se puede parar, pero no estacionar?","o":["En un paso a nivel.","En un túnel.","En doble fila."],"c":2,"e":"En doble fila se puede parar, pero no estacionar. En túneles y pasos a nivel no se puede ni parar.","p":"299-300","id":197},{"tema":"T12","q":"En un cruce sin señales, por tu derecha llega un coche por un camino estrecho y asfaltado. ¿Quién pasa?","o":["Tú, porque tu vía es más ancha y mejor.","El coche que viene por tu derecha.","El que llegue primero al cruce."],"c":1,"e":"Preferencia de la derecha, aunque venga por una vía estrecha.","p":"302","id":198},{"tema":"T12","q":"En un cruce sin señales, ¿quién tiene preferencia entre un tranvía y un coche?","o":["El tranvía, porque va por raíles.","El coche, si viene por la derecha.","El que tenga la vía más ancha y en mejor estado."],"c":0,"e":"Los vehículos que van por raíles tienen preferencia.","p":"303","id":199},{"tema":"T12","q":"Al llegar a una rotonda, ¿quién tiene preferencia?","o":["El que quiere entrar por la derecha de la rotonda.","El vehículo más grande, sea cual sea.","El que ya está dentro de la rotonda."],"c":2,"e":"Los que ya están dentro tienen preferencia sobre los que quieren entrar.","p":"303","id":200},{"tema":"T12","q":"El semáforo está verde, pero detrás del paso de peatones hay coches parados. ¿Qué haces?","o":["Esperas antes del paso de peatones.","Entras, porque el semáforo está verde.","Tocas el claxon para que avancen los de delante."],"c":0,"e":"No entres si te vas a quedar atrapado en medio.","p":"304","id":201},{"tema":"T12","q":"Un grupo de ciclistas está cruzando una intersección y el primero ya ha entrado. ¿Qué haces?","o":["Pasas entre dos ciclistas cuando haya hueco.","Esperas a que pase todo el grupo.","Pasas, si vienes por su derecha."],"c":1,"e":"Hay que esperar a que pase todo el grupo.","p":"306","id":202},{"tema":"T12","q":"Vas a girar a la derecha y hay peatones cruzando la calle a la que entras. ¿Quién tiene preferencia?","o":["Tú, por tu semáforo verde.","Tú, si no hay paso de peatones pintado.","Los peatones."],"c":2,"e":"Al girar hacia una vía por la que cruzan peatones, ellos tienen preferencia.","p":"306","id":203},{"tema":"T12","q":"Unas personas bajan del autobús en una parada. ¿Qué haces?","o":["Les cedes el paso hasta la zona peatonal más cercana.","Sigues, porque no están en un paso de peatones.","Les avisas con el claxon para que esperen."],"c":0,"e":"Hay que ceder el paso a quienes suben o bajan del transporte público.","p":"307","id":204},{"tema":"T12","q":"¿Cómo avisa de su llegada un vehículo de urgencias en servicio?","o":["Con la luz de largo alcance fija y encendida.","Con la sirena y las luces preparadas para ello.","Agitando un pañuelo por la ventanilla del conductor."],"c":1,"e":"Encendiendo la sirena y las luces especiales.","p":"308","id":205},{"tema":"T12","q":"Una ambulancia en servicio urgente llega a un semáforo rojo. Puede…","o":["pasar sin mirar, porque tiene preferencia absoluta.","nunca pasar, porque debe respetar los semáforos.","pasar, asegurándose de que no pone a nadie en peligro."],"c":2,"e":"Puede saltarse señales, pero sin poner en peligro a peatones ni vehículos.","p":"309","id":206},{"tema":"T12","q":"Un vehículo de urgencias en servicio, ¿qué órdenes debe obedecer?","o":["Solo las de los agentes de tráfico.","Todas las señales verticales de la vía.","Solo los semáforos."],"c":0,"e":"Las únicas que deben obedecer son las de los agentes.","p":"309","id":207},{"tema":"T12","q":"Llevas en tu coche a una mujer que va a dar a luz. ¿Qué es correcto?","o":["Puedes saltarte los semáforos en rojo con cuidado.","Puedes avisar, pero debes respetar las normas.","Puedes ir por el carril contrario si encuentras atasco."],"c":1,"e":"Puedes avisar con claxon, luces de emergencia o pañuelo, pero respetando las normas.","p":"310-311","id":208},{"tema":"T12","q":"En una zona estrecha sin señales, si no se sabe quién entró primero, pasa…","o":["el vehículo más pequeño y más fácil de manejar.","el que viene por la derecha del otro conductor.","el que tiene más dificultad para maniobrar."],"c":2,"e":"En caso de duda, los que tienen más dificultades para maniobrar.","p":"312","id":209},{"tema":"T12","q":"En una zona estrecha se encuentran un autobús y un turismo. ¿Quién tiene preferencia?","o":["El autobús.","El turismo.","El que tenga prisa."],"c":0,"e":"En el orden del libro, los autobuses (5.º) van antes que los turismos (7.º).","p":"312","id":210},{"tema":"T12","q":"Dos turismos se encuentran en una zona estrecha. Uno tendría que ir 10 m marcha atrás y el otro 40 m. ¿Quién pasa?","o":["El que tendría que ir 10 m marcha atrás.","El que tendría que ir 40 m marcha atrás.","El que tenga el coche más nuevo de los dos."],"c":1,"e":"Pasa el que tendría que dar marcha atrás durante más distancia.","p":"313","id":211},{"tema":"T12","q":"En una cuesta muy inclinada y estrecha, ¿quién tiene preferencia, en general?","o":["El que baja, porque frena peor.","El más pequeño.","El que va cuesta arriba."],"c":2,"e":"El que circula cuesta arriba, salvo que tenga más cerca un sitio para parar.","p":"314","id":212},{"tema":"T12","q":"Las barreras de un paso a nivel se están moviendo. ¿Qué haces?","o":["Esperas en tu carril hasta que el paso quede libre.","Cruzas rápido antes de que se cierren del todo.","Adelantas a la fila por el carril contrario."],"c":0,"e":"No se cruza si las barreras están en movimiento; se espera en fila.","p":"315","id":213},{"tema":"T12","q":"¿Qué distancia mínima debe dejar un turismo con el de delante dentro de un túnel?","o":["50 metros o 2 segundos.","100 metros o 4 segundos.","150 metros o 6 segundos."],"c":1,"e":"100 m o 4 s; más de 3.500 kg, 150 m o 6 s.","p":"316","id":214},{"tema":"T12","q":"Hay un incendio dentro de un túnel. ¿Qué haces con tu vehículo?","o":["Cierras con llave y te llevas la llave contigo.","Te quedas dentro con las ventanillas cerradas.","Lo apartas a la derecha, apagas el motor y dejas la llave puesta."],"c":2,"e":"A la derecha, motor apagado, llave puesta y puertas sin cerrar; salir en sentido contrario al fuego.","p":"318","id":215},{"tema":"T13","q":"¿Cómo debe nte."],"c":1,"e":"A los lados del cuello, nunca debajo.","p":"421","id":283},{"tema":"T16","q":"Un herido no respira con normalidad. ¿Qué haces?","o":["Le das agua para que se recupere.","Lo dejas tumbado y te vas a buscar ayuda.","Reanimación: 30 compresiones y 2 ventilaciones."],"c":2,"e":"Reanimación cardiopulmonar hasta que llegue la ayuda médica.","p":"427","id":284},{"tema":"T16","q":"Un herido tiene un trozo de metal clavado y sangra. ¿Qué haces?","o":["No sacas el objeto.","Sacas el objeto con cuidado.","Le pones un torniquete enseguida."],"c":0,"e":"Si hay un objeto clavado, no hay que intentar sacarlo.","p":"428","id":285},{"tema":"T16","q":"Un herido está pálido, con sudor frío y pulso rápido y débil. ¿Cómo lo colocas?","o":["Sentado, con la cabeza entre las piernas.","Tumbado, con los pies más altos que la cabeza.","De pie, apoyado en el vehículo."],"c":1,"e":"Son síntomas de shock: tumbado con los pies más altos que la cabeza.","p":"432","id":286},{"tema":"T16","q":"¿Qué debes hacer con una quemadura?","o":["Reventar las ampollas para que se cure antes.","Quitar la ropa pegada a la quemadura.","Echar agua fría sobre la zona quemada."],"c":2,"e":"Agua fría; no reventar ampollas ni quitar la ropa pegada.","p":"434","id":287},{"tema":"T17","q":"Antes de un viaje en turismo, ¿qué debes llevar?","o":["Un extintor y una caja de herramientas completa.","La luz de peligro o los triángulos, un chaleco y la rueda de repuesto.","Una garrafa de combustible y una cuerda para remolcar."],"c":1,"e":"Son las comprobaciones que da el libro; el botiquín es conveniente.","p":"438","id":288},{"tema":"T17","q":"Viajas en invierno. ¿Qué precaución aconseja el libro?","o":["Llevar el depósito lleno.","Conducir sobre todo de noche, cuando hay menos tráfico.","Dejar las cadenas en casa para ir más ligero."],"c":0,"e":"Cadenas, evitar la noche, depósito lleno, abrigo, agua, comida y linterna.","p":"439","id":289},{"tema":"T17","q":"¿Cuáles son los tres principios de la conducció os dos o tres metros.","p":"448","id":297},{"tema":"T17","q":"Se ha agotado la batería del coche. ¿Qué no debes hacer?","o":["Llamar a un servicio de asistencia.","Cargar o cambiar la batería.","Arrancar el coche empujándolo."],"c":2,"e":"El combustible sin quemar puede destruir el catalizador.","p":"451","id":298},{"tema":"T17","q":"Al arrancar el motor, para ahorrar combustible…","o":["no pisas el acelerador y sales enseguida.","pisas el acelerador varias veces para calentarlo.","esperas parado diez minutos a que se caliente."],"c":0,"e":"Arrancar sin acelerar y empezar a circular justo después.","p":"452","id":299},{"tema":"T17","q":"¿En qué marchas gasta menos combustible el vehículo?","o":["En primera y segunda.","En cuarta y quinta.","En marcha atrás."],"c":1,"e":"El vehículo gasta menos en cuarta y quinta.","p":"453","id":300},{"tema":"T17","q":"¿A partir de qué velocidad aumentan mucho el consumo y la contaminación?","o":["A partir de 40 o 50 km/h.","A partir de 120 km/h.","A partir de 80 o 90 km/h."],"c":2,"e":"A partir de los 80 o 90 km/h.","p":"454","id":301},{"tema":"T17","q":"¿Cuándo debes apagar el motor si estás parado?","o":["Si vas a estar parado más de un minuto.","Solo si vas a estar parado más de diez minutos.","Nunca, porque arrancar gasta más que esperar."],"c":0,"e":"Apagar el motor si va a estar más de un minuto parado.","p":"454","id":302},{"tema":"T17","q":"¿Cuál de estas medidas es un falso ahorro?","o":["Circular a velocidad constante.","Bajar las cuestas en punto muerto.","Quitar la baca cuando no se usa."],"c":1,"e":"Bajar en punto muerto es falso ahorro: pierdes estabilidad y abusas de los frenos.","p":"461","id":303},{"tema":"T17","q":"¿Cuántos tipos de distintivo ambiental hay?","o":["Cuatro.","Dos.","Seis."],"c":0,"e":"Cuatro: Cero emisiones, Eco, B y C.","p":"463","id":304},{"tema":"T17","q":"¿Dónde se coloca el distintivo ambiental?","o":["En el cristal trasero, abajo a la izquierda.","Junto a la matrícula delantera.","En la parte derecha del parabrisas."],"c":2,"e":"Delante, en la parte derecha del cristal delantero.","p":"465","id":305},{"tema":"ANEXO","q":"¿Cuántos puntos tiene un conductor que acaba de sacar el permiso?","o":["12 puntos.","8 puntos.","15 puntos."],"c":1,"e":"8 puntos durante los dos primeros años.","p":"468","id":306},{"tema":"ANEXO","q":"Un conductor novel no pierde ningún punto en dos años. ¿Cuántos tendrá?","o":["12 puntos.","10 puntos.","14 puntos."],"c":0,"e":"Pasa de 8 a 12 puntos.","p":"468","id":307},{"tema":"ANEXO","q":"¿Cuál es el número máximo de puntos?","o":["12 puntos.","14 puntos.","15 puntos."],"c":2,"e":"El máximo es 15.","p":"468","id":308},{"tema":"ANEXO","q":"Si pierdes todos los puntos por primera vez, ¿cuánto tiempo no puedes conducir?","o":["Tres meses.","Seis meses.","Dos años."],"c":1,"e":"Seis meses; después, curso de 24 horas y examen.","p":"469","id":309},{"tema":"ANEXO","q":"¿Cuánto dura el curso para recuperar el permiso tras perder todos los puntos?","o":["12 horas.","8 horas.","24 horas."],"c":2,"e":"Curso de 24 horas y examen en la Jefatura.","p":"469","id":310},{"tema":"ANEXO","q":"Con el curso de 12 horas, ¿cuántos puntos puedes recuperar?","o":["Hasta 6 puntos.","Todos los puntos.","Solo 2 puntos."],"c":0,"e":"Hasta 6 puntos.","p":"469","id":311},{"tema":"ANEXO","q":"Has perdido algunos puntos. ¿Cuándo los recuperas sin hacer el curso?","o":["Al año, aunque pierdas más puntos en ese tiempo.","Si no pierdes más durante dos años.","Nunca: solo se recuperan con el curso."],"c":1,"e":"Se recuperan si no se pierden más en dos años.","p":"469","id":312},{"tema":"ANEXO","q":"¿Cuántos puntos quita hacer un cambio de sentido donde está prohibido?","o":["2 puntos.","6 puntos.","3 puntos."],"c":2,"e":"Cambio de sentido prohibido: 3 puntos.","p":"470","id":313},{"tema":"ANEXO","q":"¿Cuántos puntos quita conducir con auriculares conectados al móvil?","o":["3 puntos.","4 puntos.","6 puntos."],"c":0,"e":"Cascos o auriculares conectados: 3 puntos.","p":"471","id":314},{"tema":"ANEXO","q":"Un conductor con 10 años de permiso da 0,40 mg/l de alcohol en aire. ¿Cuántos puntos pierde?","o":["6 puntos.","4 puntos.","Ninguno."],"c":1,"e":"Entre 0,25 y 0,50: 4 puntos.","p":"471","id":315},{"tema":"ANEXO","q":"Un conductor novel da 0,20 mg/l en aire. ¿Cuántos puntos pierde?","o":["Ninguno, porque es menos de 0,25.","6 puntos.","4 puntos."],"c":2,"e":"Noveles y profesionales: de 0,15 a 0,30, 4 puntos.","p":"471","id":316},{"tema":"ANEXO","q":"¿Cuántos puntos quita no llevar puesto el cinturón de seguridad?","o":["4 puntos.","2 puntos.","6 puntos."],"c":0,"e":"Sin cinturón, casco o sistemas obligatorios: 4 puntos.","p":"472","id":317},{"tema":"ANEXO","q":"¿Cuántos puntos quita no guardar la distancia de seguridad?","o":["3 puntos.","4 puntos.","6 puntos."],"c":1,"e":"No mantener la distancia: 4 puntos.","p":"472","id":318},{"tema":"ANEXO","q":"¿Cuántos puntos quita negarse a hacer la prueba de alcohol?","o":["Ninguno, si no has bebido.","4 puntos.","6 puntos."],"c":2,"e":"Negarse a las pruebas: 6 puntos.","p":"473","id":319},{"tema":"ANEXO","q":"¿Cuántos puntos quita conducir con el móvil en la mano?","o":["6 puntos.","3 puntos.","4 puntos."],"c":0,"e":"Móvil en la mano: 6 puntos.","p":"474","id":320},{"tema":"ANEXO","q":"Adelantas a un ciclista dejando solo medio metro. ¿Cuántos puntos pierdes?","o":["2 puntos.","6 puntos.","3 puntos."],"c":1,"e":"Adelantar a ciclistas sin dejar 1,5 m: 6 puntos.","p":"474","id":321},{"tema":"ANEXO","q":"¿Cuántos puntos quita llevar un aparato para detectar radares?","o":["6 puntos.","Ninguno: es legal.","3 puntos."],"c":2,"e":"Detector de radares: 3 puntos. Los inhibidores (que el radar no te detecte): 6.","p":"471, 474","id":322},{"tema":"ANEXO","q":"¿Cuántos puntos quita el exceso de velocidad?","o":["De 2 a 6, según la velocidad.","Siempre 4 puntos.","Siempre 6 puntos."],"c":0,"e":"De 2 a 6 puntos, según la velocidad.","p":"470","id":323}]};
  </script>
  <script>
  (function () {
    "use strict";
    var D = window.SIMULADOR, TEMAS = {}, CLAVE = "simulador-historial";
    D.temas.forEach(function (t) { TEMAS[t.id] = t; });
    var ex = null, reloj = null;

    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function ref(p) { return p ? ' <span class="ref" tabindex="0" data-tooltip="Manual Permiso B (DGT, LF), p. ' + esc(p) + '">p.' + esc(p) + "</span>" : ""; }
    function barajar(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
    function etiqueta(t) { return '<span class="si-tema" style="--c:' + t.color + '">' + esc(t.titulo) + "</span>"; }
    function mmss(s) { s = Math.max(0, s); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
    function leerHist() { try { return JSON.parse(localStorage.getItem(CLAVE) || "[]") || []; } catch (e) { return []; } }
    function guardarHist(h) { try { localStorage.setItem(CLAVE, JSON.stringify(h.slice(0, 10))); } catch (e) { /* sin almacenamiento */ } }

    /* Orden de las opciones: se barajan salvo las fijas, que se quedan en su sitio */
    function ordenOpciones(q) {
      var fijas = q.fija || [];
      var libres = barajar([0, 1, 2].filter(function (k) { return fijas.indexOf(k) < 0; }));
      return [0, 1, 2].map(function (k) { return fijas.indexOf(k) >= 0 ? k : libres.shift(); });
    }

    /* ---------- Preparar ---------- */
    function elegidos() { return Array.prototype.map.call(document.querySelectorAll("#si-temas input:checked"), function (i) { return i.value; }); }
    function actualizarDisponibles() {
      var sel = elegidos();
      var n = D.preguntas.filter(function (q) { return sel.indexOf(q.tema) >= 0; }).length;
      $("si-disponibles").textContent = "(" + n + " preguntas)";
      $("si-empezar").disabled = !n;
    }
    function pintarHistorial() {
      var h = leerHist();
      $("si-hist-caja").hidden = !h.length;
      $("si-historial").innerHTML = h.map(function (r) {
        return "<li>" + esc(r.fecha) + ": <b>" + r.bien + " de " + r.n + "</b> bien (" + Math.round(100 * r.bien / r.n) + " %)</li>";
      }).join("");
    }

    function empezar(lista, conReloj) {
      ex = { qs: lista.map(function (q) { return { q: q, orden: ordenOpciones(q), resp: null }; }),
             i: 0, conReloj: conReloj, inicio: Date.now(), limite: conReloj ? lista.length * 60 : 0 };
      $("si-inicio").hidden = true;
      $("si-resultado").hidden = true;
      $("si-examen").hidden = false;
      clearInterval(reloj);
      reloj = setInterval(tic, 1000);
      tic();
      pintarPregunta();
      window.scrollTo(0, 0);
    }
    function segundos() { return Math.round((Date.now() - ex.inicio) / 1000); }
    function tic() {
      var r = $("si-reloj");
      if (!ex.conReloj) { r.textContent = "⏱ " + mmss(segundos()); return; }
      var queda = ex.limite - segundos();
      r.textContent = "⏱ " + mmss(queda);
      r.classList.toggle("poco", queda <= 60);
      if (queda <= 0) corregir(true);
    }

    /* ---------- Examen ---------- */
    function pintarPregunta() {
      var it = ex.qs[ex.i], q = it.q, n = ex.qs.length;
      var hechas = ex.qs.filter(function (x) { return x.resp !== null; }).length;
      $("si-contador").textContent = "Pregunta " + (ex.i + 1) + " de " + n + " · " + hechas + " respondidas";
      $("si-barra").style.width = Math.round(100 * hechas / n) + "%";
      $("si-pregunta").innerHTML = etiqueta(TEMAS[q.tema]) + '<p class="si-enunciado">' + esc(q.q) + '</p><ol class="opciones">' +
        it.orden.map(function (k, pos) {
          return '<li><button type="button" data-op="' + k + '" aria-pressed="' + (it.resp === k) + '"' + (it.resp === k ? ' class="elegida"' : "") +
            '><span class="letra">' + "abc"[pos] + ")</span><span>" + esc(q.o[k]) + "</span></button></li>";
        }).join("") + "</ol>";
      $("si-anterior").disabled = ex.i === 0;
      $("si-siguiente").disabled = ex.i === n - 1;
      $("si-mapa").innerHTML = ex.qs.map(function (x, k) {
        return '<li><button type="button" data-ir="' + k + '" class="' + (x.resp !== null ? "respondida" : "") + (k === ex.i ? " actual" : "") +
          '" aria-label="Pregunta ' + (k + 1) + (x.resp !== null ? ", respondida" : "") + '">' + (k + 1) + "</button></li>";
      }).join("");
    }
    function ir(k) { ex.i = Math.max(0, Math.min(ex.qs.length - 1, k)); pintarPregunta(); }

    /* ---------- Corregir ---------- */
    function corregir(porTiempo) {
      if (!ex || ex.fin) return;
      clearInterval(reloj);
      ex.fin = true;
      var bien = ex.qs.filter(function (x) { return x.resp === x.q.c; }).length, n = ex.qs.length;
      var sinResp = ex.qs.filter(function (x) { return x.resp === null; }).length;
      var porTema = {};
      ex.qs.forEach(function (x) {
        var t = porTema[x.q.tema] = porTema[x.q.tema] || { bien: 0, n: 0 };
        t.n++; if (x.resp === x.q.c) t.bien++;
      });
      var h = leerHist();
      h.unshift({ fecha: new Date().toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" }), n: n, bien: bien });
      guardarHist(h);

      var html = '<div class="si-caja"><h2>' + (porTiempo ? "⏰ Se acabó el tiempo. " : "") + "Resultado</h2>" +
        '<p class="si-nota">' + bien + " de " + n + "</p><p>" + Math.round(100 * bien / n) + " % bien · " + (n - bien - sinResp) + " fallos · " +
        sinResp + " sin responder · tiempo: " + mmss(segundos()) + "</p>" +
        '<table class="si-desglose"><thead><tr><th scope="col">Tema</th><th scope="col">Bien</th></tr></thead><tbody>' +
        D.temas.filter(function (t) { return porTema[t.id]; }).map(function (t) {
          var r = porTema[t.id];
          return "<tr><td>" + esc(t.titulo) + "</td><td>" + r.bien + " de " + r.n + "</td></tr>";
        }).join("") + "</tbody></table>" +
        '<div class="si-botones">' + (bien < n ? '<button type="button" class="si-boton si-boton--primario" id="si-repetir">Repetir las que no acertaste (' + (n - bien) + ")</button>" : "") +
        '<button type="button" class="si-boton" id="si-nuevo">Nuevo examen</button></div></div>' +
        '<div class="si-caja"><h2>Revisión</h2><div class="si-chips"><label><input type="checkbox" id="si-solo-fallos"> Ver solo los fallos</label></div>' +
        '<ol class="si-revision" id="si-revision">' + ex.qs.map(function (x, k) {
          var q = x.q, ok = x.resp === q.c, t = TEMAS[q.tema];
          return '<li class="' + (ok ? "bien" : "mal") + '"><p>' + etiqueta(t) + '</p><p class="si-enunciado">' + (k + 1) + ". " + esc(q.q) + '</p><ol class="opciones">' +
            x.orden.map(function (o, pos) {
              var cls = o === q.c ? "correcta" : (o === x.resp ? "incorrecta" : "");
              return '<li><button type="button" disabled class="' + cls + '"><span class="letra">' + "abc"[pos] + ")</span><span>" + esc(q.o[o]) +
                (o === x.resp ? '<span class="si-tu">← tu respuesta</span>' : "") + "</span></button></li>";
            }).join("") + "</ol>" + (x.resp === null ? '<p class="muted">Sin responder.</p>' : "") +
            '<p class="si-explica">' + (ok ? "✔ " : "✘ ") + esc(q.e) + ref(q.p) + ' · <a href="../' + esc(t.archivo) + '">Ver el tema →</a></p></li>';
        }).join("") + "</ol></div>";
      $("si-examen").hidden = true;
      $("si-resultado").innerHTML = html;
      $("si-resultado").hidden = false;
      window.scrollTo(0, 0);
    }

    /* ---------- Arranque ---------- */
    $("si-temas").innerHTML = D.temas.map(function (t) {
      return '<label style="--c:' + t.color + '"><input type="checkbox" value="' + t.id + '" checked> ' + esc(t.titulo) + "</label>";
    }).join("");
    $("si-temas").addEventListener("change", actualizarDisponibles);
    $("si-todos").addEventListener("click", function () { document.querySelectorAll("#si-temas input").forEach(function (i) { i.checked = true; }); actualizarDisponibles(); });
    $("si-ninguno").addEventListener("click", function () { document.querySelectorAll("#si-temas input").forEach(function (i) { i.checked = false; }); actualizarDisponibles(); });
    $("si-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var sel = elegidos();
      var n = +document.querySelector('input[name="n"]:checked').value;
      var pool = barajar(D.preguntas.filter(function (q) { return sel.indexOf(q.tema) >= 0; }));
      empezar(n ? pool.slice(0, n) : pool, document.querySelector('input[name="reloj"]:checked').value === "1");
    });
    $("si-pregunta").addEventListener("click", function (e) {
      var b = e.target.closest("[data-op]");
      if (!b) return;
      ex.qs[ex.i].resp = +b.dataset.op;
      pintarPregunta();
    });
    $("si-mapa").addEventListener("click", function (e) { var b = e.target.closest("[data-ir]"); if (b) ir(+b.dataset.ir); });
    $("si-anterior").addEventListener("click", function () { ir(ex.i - 1); });
    $("si-siguiente").addEventListener("click", function () { ir(ex.i + 1); });
    $("si-terminar").addEventListener("click", function () {
      var faltan = ex.qs.filter(function (x) { return x.resp === null; }).length;
      if (faltan && !window.confirm("Te quedan " + faltan + " preguntas sin responder. ¿Corregir igualmente?")) return;
      corregir(false);
    });
    $("si-resultado").addEventListener("click", function (e) {
      if (e.target.id === "si-nuevo") { ex = null; $("si-resultado").hidden = true; $("si-inicio").hidden = false; pintarHistorial(); window.scrollTo(0, 0); }
      if (e.target.id === "si-repetir") {
        empezar(barajar(ex.qs.filter(function (x) { return x.resp !== x.q.c; }).map(function (x) { return x.q; })), ex.conReloj);
      }
    });
    $("si-resultado").addEventListener("change", function (e) {
      if (e.target.id !== "si-solo-fallos") return;
      document.querySelectorAll("#si-revision > li.bien").forEach(function (li) { li.hidden = e.target.checked; });
    });
    document.addEventListener("keydown", function (e) {
      if (!ex || ex.fin || $("si-examen").hidden || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      var k = { a: 0, b: 1, c: 2 }[e.key.toLowerCase()];
      if (k !== undefined) { ex.qs[ex.i].resp = ex.qs[ex.i].orden[k]; pintarPregunta(); }
      if (e.key === "ArrowRight") ir(ex.i + 1);
      if (e.key === "ArrowLeft") ir(ex.i - 1);
    });
    actualizarDisponibles();
    pintarHistorial();
  })();
  </script>
